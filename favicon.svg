<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle/Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="10" opacity="0.6"/>

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Crown -->
    <path d="M -90 -140 L -120 -60 L -40 -80 L 0 -150 L 40 -80 L 120 -60 L 90 -140 L 40 -100 L 0 -160 L -40 -100 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-165" r="10" fill="#ffe082"/>
    <circle cx="-90" cy="-145" r="8" fill="#ffe082"/>
    <circle cx="90" cy="-145" r="8" fill="#ffe082"/>

    <!-- Shield Outline -->
    <path d="M -130 -40 Q 0 -60 130 -40 Q 140 80 0 170 Q -140 80 -130 -40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Balance Scale of Justice inside Shield -->
    <!-- Pillar -->
    <line x1="0" y1="-20" x2="0" y2="100" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-30" y1="100" x2="30" y2="100" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="14" fill="url(#goldGrad)"/>

    <!-- Beam -->
    <line x1="-85" y1="0" x2="85" y2="0" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Pan -->
    <line x1="-85" y1="0" x2="-115" y2="50" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="-85" y1="0" x2="-55" y2="50" stroke="url(#goldGrad)" stroke-width="5"/>
    <path d="M -125 50 Q -85 75 -45 50 Z" fill="url(#goldGrad)"/>

    <!-- Right Pan -->
    <line x1="85" y1="0" x2="55" y2="50" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="85" y1="0" x2="115" y2="50" stroke="url(#goldGrad)" stroke-width="5"/>
    <path d="M 45 50 Q 85 75 125 50 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
