<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#gold)" stroke-width="20" opacity="0.9"/>

  <!-- Minimalist Bold Emblem: Crown + Shield + Scales of Justice -->
  <g transform="translate(256, 240)" fill="url(#gold)" filter="url(#glow)">
    <!-- Minimalist Crown Triple Peaks -->
    <path d="M -100 -120 L -130 -40 L -50 -70 L 0 -150 L 50 -70 L 130 -40 L 100 -120 L 50 -90 L 0 -160 L -50 -90 Z" />
    <circle cx="0" cy="-172" r="14" />
    <circle cx="-100" cy="-132" r="10" />
    <circle cx="100" cy="-132" r="10" />
    
    <!-- Bold Minimalist Shield -->
    <path d="M -115 -20 Q 0 -35 115 -20 Q 125 100 0 185 Q -125 100 -115 -20 Z" stroke="url(#gold)" stroke-width="26" fill="none" stroke-linejoin="round"/>
    
    <!-- Pillar -->
    <rect x="-12" y="0" width="24" height="130" rx="10" />
    <!-- Base -->
    <rect x="-60" y="120" width="120" height="22" rx="10" />
    <!-- Cross Beam -->
    <rect x="-90" y="20" width="180" height="20" rx="10" />
    
    <!-- Left Scale Bowl -->
    <path d="M -90 38 L -120 80 Q -90 102 -60 80 Z" />
    <line x1="-90" y1="35" x2="-120" y2="80" stroke="url(#gold)" stroke-width="6"/>
    <line x1="-90" y1="35" x2="-60" y2="80" stroke="url(#gold)" stroke-width="6"/>

    <!-- Right Scale Bowl -->
    <path d="M 90 38 L 60 80 Q 90 102 120 80 Z" />
    <line x1="90" y1="35" x2="60" y2="80" stroke="url(#gold)" stroke-width="6"/>
    <line x1="90" y1="35" x2="120" y2="80" stroke="url(#gold)" stroke-width="6"/>
  </g>
</svg>
