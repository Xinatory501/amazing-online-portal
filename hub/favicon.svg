<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1915"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#gold)" stroke-width="18" opacity="0.9"/>

  <!-- Minimalist Vector Emblem: Globe Network + Shield -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Minimalist Shield Outline -->
    <path d="M -110 -130 Q 0 -150 110 -130 Q 120 40 0 170 Q -120 40 -110 -130 Z" stroke="url(#gold)" stroke-width="20" fill="none" stroke-linejoin="round"/>
    
    <!-- Minimalist Globe Grid -->
    <circle cx="0" cy="0" r="75" stroke="url(#gold)" stroke-width="14" fill="none"/>
    <ellipse cx="0" cy="0" rx="75" ry="32" stroke="url(#gold)" stroke-width="10" fill="none"/>
    <ellipse cx="0" cy="0" rx="32" ry="75" stroke="url(#gold)" stroke-width="10" fill="none"/>
    <line x1="-75" y1="0" x2="75" y2="0" stroke="url(#gold)" stroke-width="10"/>
    <line x1="0" y1="-75" x2="0" y2="75" stroke="url(#gold)" stroke-width="10"/>

    <!-- Network Node Dots -->
    <circle cx="0" cy="-75" r="12" fill="url(#gold)"/>
    <circle cx="0" cy="75" r="12" fill="url(#gold)"/>
    <circle cx="-75" cy="0" r="12" fill="url(#gold)"/>
    <circle cx="75" cy="0" r="12" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="14" fill="url(#gold)"/>
  </g>
</svg>
